baseURL = 'https://ksgab2.github.io/'
title = '교육 블로그'
theme = "hugo-theme-stack-master"
languageCode = 'ko-kr'
hasCJKLanguage = true

[params]
  title = "Book Bot Library"
  subtitle = "Node.js 자동화 봇이 5분마다 수집하는 실시간 도서 정보"
  location = "Seoul, South Korea"
  header_image = "img/home-bg.jpg"
  sidebar = true
  sidebar_avatar = "img/avatar.png"
  bio = "AI교육 블로그입니다."
  featured_tags = true
  featured_fast = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

# Clean White 테마가 내 글 폴더(post)를 메인 화면에 불러오도록 강제 지정
[permalinks]
  post = "/:year/:month/:day/:slug/"

[frontmatter]
  staticDir = ["static"]

# 휴고가 콘텐츠 내부(content/posts/images)에 있는 사진을 
# 빌드할 때 최종 Publish 폴더로 그대로 복사해 가도록 허용하는 설정입니다.
[imaging]
  resampleFilter = "box"
  quality = 75

# (선택) 만약 깃허브 액션이나 빌드 설정에 따라 출력 폴더를 명시하고 싶다면
publishDir = "public"